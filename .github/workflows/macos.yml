name: macOS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Build and smoke-test Saffron.app
    runs-on: macos-14   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Install the Homebrew runtime dependencies
        run: brew install spice-gtk pygobject3 pyside
      - name: Build Saffron.app and .dmg
        run: packaging/macos/build.sh
      - name: Smoke test
        run: packaging/macos/smoke_test.sh
      - name: Unit tests on the Homebrew stack
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          PY="$(brew --prefix python@3.15)/bin/python3.15"
          "$PY" -m venv --system-site-packages .venv
          .venv/bin/pip install pytest pytest-qt
          .venv/bin/python -m pytest -v
      - uses: actions/upload-artifact@v4
        with:
          name: saffron-macos-dmg
          path: dist/*.dmg
      - name: Attach the .dmg to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
    permissions:
      contents: write
