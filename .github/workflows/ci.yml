name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Tests (Linux, live SPICE)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install spice-glib, PyGObject, QEMU and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-venv python3-gi gir1.2-spiceclientglib-2.0 \
            qemu-system-x86 qemu-system-modules-spice openssl \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      # The system Python, because python3-gi is built for it; a venv with
      # system site-packages sees gi while PySide6 comes from pip.
      - name: Install Saffron
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Self-test
        run: .venv/bin/saffron --self-test
      - name: Tests (including live QEMU SPICE plain + TLS/proxy)
        env:
          QT_QPA_PLATFORM: offscreen
          SAFFRON_LIVE: "1"
        run: .venv/bin/python -m pytest -v
